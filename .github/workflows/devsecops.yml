name: GuardZen Secure CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python
          # generateSarif: "1"   # uncomment to upload results to GitHub Security tab

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t guardzen-demo:${{ github.sha }} .
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "guardzen-demo:${{ github.sha }}"
          format: "table"
          exit-code: "1"        # fail the build on findings
          severity: "CRITICAL,HIGH"

  iac-scan:
    name: IaC Scan (Trivy config)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  deploy-gate:
    name: Deploy Gate
    runs-on: ubuntu-latest
    needs: [sast, container-scan, iac-scan]
    steps:
      - name: All checks passed
        run: echo "✅ SAST, container, and IaC scans passed — safe to deploy."
